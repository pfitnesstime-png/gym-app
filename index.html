<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym App – Login</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.card{
  background:#fff;
  width:320px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
h2{text-align:center;margin-top:0}
input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-weight:bold;
}
.hidden{display:none}
.link{
  text-align:center;
  margin-top:10px;
  color:#2563eb;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

  <!-- LOGIN -->
  <div id="loginBox">
    <h2>Gym Login</h2>
    <input id="l_phone" placeholder="Phone number">
    <button onclick="login()">Login</button>
    <div class="link" onclick="showRegister()">New user? Register</div>
  </div>

  <!-- REGISTER -->
  <div id="registerBox" class="hidden">
    <h2>Register</h2>
    <input id="r_name" placeholder="Name">
    <input id="r_phone" placeholder="Phone number">
    <button onclick="register()">Register</button>
    <div class="link" onclick="showLogin()">Back to login</div>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* FIREBASE INIT */
firebase.initializeApp({
  apiKey:"AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
  authDomain:"gym-app-79bec.firebaseapp.com",
  projectId:"gym-app-79bec"
});
const db = firebase.firestore();

/* AUTO LOGIN IF ALREADY LOGGED */
if(localStorage.getItem("gymPhone")){
  location.href="app.html";
}

/* TOGGLE UI */
function showRegister(){
  loginBox.classList.add("hidden");
  registerBox.classList.remove("hidden");
}
function showLogin(){
  registerBox.classList.add("hidden");
  loginBox.classList.remove("hidden");
}

/* LOGIN */
function login(){
  let phone = l_phone.value.trim();
  if(!phone){
    alert("Enter phone number");
    return;
  }

  db.collection("users").doc(phone).get().then(doc=>{
    if(doc.exists){
      // ✅ SAVE SESSION
      localStorage.setItem("gymPhone", phone);

      // ✅ GO TO APP
      location.href = "app.html";
    }else{
      alert("User not found. Please register or contact admin.");
    }
  });
}

/* REGISTER */
function register(){
  let name = r_name.value.trim();
  let phone = r_phone.value.trim();

  if(!name || !phone){
    alert("Enter all details");
    return;
  }

  db.collection("users").doc(phone).set({
    name:name,
    phone:phone,
    planStatus:"inactive",
    currentPlan:"",
    planExpiry:"",
    paymentStatus:""
  }).then(()=>{
    // ✅ AUTO LOGIN AFTER REGISTER
    localStorage.setItem("gymPhone", phone);
    location.href="app.html";
  });
}
</script>

</body>
</html>
