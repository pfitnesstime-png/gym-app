<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Attendance</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#e5e7eb}
</style>
</head>

<body>

<h2>🛠 Attendance Report</h2>

<table>
<thead>
<tr><th>Name</th><th>Phone</th><th>Date</th><th>Time</th></tr>
</thead>
<tbody id="list"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
  authDomain:"gym-app-79bec.firebaseapp.com",
  projectId:"gym-app-79bec"
});
const db=firebase.firestore();

db.collection("attendance").orderBy("timestamp","desc")
.onSnapshot(s=>{
  let h="";
  s.forEach(d=>{
    let a=d.data();
    h+=`<tr><td>${a.name}</td><td>${a.phone}</td><td>${a.date}</td><td>${a.time}</td></tr>`;
  });
  list.innerHTML=h;
});
</script>

</body>
</html>
