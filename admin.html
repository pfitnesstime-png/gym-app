<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym App – Admin</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
  padding-bottom:70px;
}
header{
  background:#111827;
  color:#fff;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.card{
  background:#fff;
  margin:15px;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.1)
}
input,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:6px;
  border:1px solid #ccc
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-weight:bold
}
.ok{background:#16a34a}
.del{background:#dc2626}
.hidden{display:none}

/* bottom nav */
.nav{
  position:fixed;
  bottom:0;left:0;right:0;
  height:60px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
}
.nav button{
  flex:1;
  background:none;
  border:none;
  color:#6b7280;
  font-size:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.nav button i{font-size:18px}
.nav button.active{color:#2563eb}
</style>
</head>

<body>

<header>
  <h3>🛠️ Admin Panel</h3>
  <i class="fa fa-sign-out-alt"
     style="cursor:pointer"
     onclick="location.href='index.html'"></i>
</header>

<!-- PLAN REQUESTS -->
<div class="card" id="requests">
  <h3>Plan Requests</h3>
  <div id="reqList">Loading...</div>
</div>

<!-- USERS -->
<div class="card hidden" id="users">
  <h3>Add New User</h3>
  <input id="uname" placeholder="User name">
  <input id="uphone" placeholder="Phone number">
  <button onclick="addUser()">Add User</button>
  <hr>

  <h3>All Users</h3>
  <div id="usersList">Loading...</div>
</div>

<!-- PLANS -->
<div class="card hidden" id="plans">
  <h3>Add Plan</h3>
  <input id="pname" placeholder="Plan name">
  <input id="pdays" type="number" placeholder="Days">
  <input id="pprice" type="number" placeholder="Price">
  <button onclick="addPlan()">Add Plan</button>
  <hr>
  <div id="plansList">Loading...</div>
</div>

<!-- QR -->
<div class="card hidden" id="qr">
  <h3>Gym QR</h3>
  <p>Print & keep inside gym</p>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=GYM_ATTENDANCE">
</div>

<!-- NAV -->
<div class="nav">
  <button class="active" onclick="showTab('requests',this)">
    <i class="fa fa-clock"></i>Requests
  </button>
  <button onclick="showTab('users',this)">
    <i class="fa fa-users"></i>Users
  </button>
  <button onclick="showTab('plans',this)">
    <i class="fa fa-list"></i>Plans
  </button>
  <button onclick="showTab('qr',this)">
    <i class="fa fa-qrcode"></i>QR
  </button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
  authDomain:"gym-app-79bec.firebaseapp.com",
  projectId:"gym-app-79bec"
});
const db = firebase.firestore();

/* Tabs */
function showTab(id,btn){
  ["requests","users","plans","qr"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

/* ADD USER */
function addUser(){
  let name = uname.value.trim();
  let phone = uphone.value.trim();
  if(!name || !phone){
    alert("Enter name & phone");
    return;
  }
  db.collection("users").doc(phone).set({
    name, phone,
    planStatus:"inactive",
    paymentStatus:"",
    currentPlan:"",
    planExpiry:""
  }).then(()=>{
    alert("User added ✅");
    uname.value=""; uphone.value="";
  });
}

/* LOAD USERS */
function loadUsers(){
  db.collection("users").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let u=d.data();
      h+=`
        <p>
          <b>${u.name}</b><br>
          📞 ${u.phone}<br>
          Status: ${u.planStatus||"inactive"}
        </p><hr>
      `;
    });
    usersList.innerHTML=h||"No users";
  });
}

/* REQUESTS */
function loadRequests(){
  db.collection("users").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let u=d.data();
      if(u.planStatus==="pending"){
        h+=`
          <div style="border:1px solid #eee;padding:10px;margin-bottom:10px">
            <b>${u.name}</b><br>
            📞 ${u.phone}<br>
            Plan: ${u.requestedPlan}<br>
            Days: ${u.requestedDays}<br>
            Amount: ₹${u.requestedPrice}<br>
            <button class="ok"
              onclick="approve('${d.id}',${u.requestedDays},'${u.requestedPlan}')">
              Confirm & Activate
            </button>
            <button class="del" onclick="reject('${d.id}')">
              Reject
            </button>
          </div>
        `;
      }
    });
    reqList.innerHTML=h||"No requests";
  });
}

function approve(id,days,plan){
  let exp=new Date();
  exp.setDate(exp.getDate()+days);
  db.collection("users").doc(id).update({
    planStatus:"active",
    paymentStatus:"paid",
    currentPlan:plan,
    planExpiry:exp.toISOString(),
    requestedPlan:"",
    requestedDays:"",
    requestedPrice:""
  });
  alert("Plan activated ✅");
}

function reject(id){
  db.collection("users").doc(id).update({
    planStatus:"inactive",
    requestedPlan:"",
    requestedDays:"",
    requestedPrice:"",
    paymentStatus:""
  });
}

/* PLANS */
function loadPlans(){
  db.collection("plans").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let p=d.data();
      h+=`
        <p>${p.name} – ${p.days} days – ₹${p.price}</p>
        <button class="del" onclick="delPlan('${d.id}')">Delete</button>
        <hr>
      `;
    });
    plansList.innerHTML=h||"No plans";
  });
}
function addPlan(){
  db.collection("plans").add({
    name:pname.value,
    days:+pdays.value,
    price:+pprice.value
  });
  pname.value=pdays.value=pprice.value="";
}
function delPlan(id){
  if(confirm("Delete plan?"))
    db.collection("plans").doc(id).delete();
}

/* INIT */
loadUsers();
loadRequests();
loadPlans();
</script>

</body>
</html>
