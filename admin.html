<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Gym App – Admin</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<script>
if(localStorage.getItem("admin") !== "true"){
  window.location.href = "admin-login.html";
}
</script>

<style>

/* ===== BASE ===== */
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
  padding-bottom:110px;
}

/* ===== HEADER ===== */
header{
  background:#111827;
  padding:10px 0;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

header img{ height:60px; }

header i{
  position:absolute;
  right:15px;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* ===== CARD ===== */
.card{
  background:#fff;
  margin:15px;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

input,select,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-weight:bold;
}

.hidden{display:none}

/* ===== BOTTOM NAV ===== */
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  padding-bottom:env(safe-area-inset-bottom);
  background:#2563eb;
  display:flex;
  z-index:9999;
}

.nav button{
  flex:1;
  border:none;
  background:transparent;
  color:#fff;
  font-size:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.nav button i{ font-size:18px; }

.nav button.active{
  background:rgba(255,255,255,0.15);
  border-radius:6px;
}

</style>
</head>

<body>

<header>
  <img src="logo.PNG.png">
  <i class="fa fa-sign-out-alt" onclick="adminLogout()"></i>
</header>

<!-- ADD USER -->
<div class="card" id="addUser">
  <h3>Add User + Assign Plan</h3>

  <input id="uname" placeholder="User name">
  <input id="uphone" placeholder="Phone number">

  <select id="uplan">
    <option value="">Select Plan</option>
  </select>

  <input id="uamount" type="number" placeholder="Payment Amount">

  <select id="umode">
    <option value="">Payment Mode</option>
    <option>Cash</option>
    <option>UPI</option>
    <option>Card</option>
  </select>

  <button onclick="addUser()">Add User</button>
</div>

<!-- USERS -->
<div class="card hidden" id="users">
  <h3>Users</h3>
  <div id="usersList">Loading...</div>
</div>

<!-- PLANS -->
<div class="card hidden" id="plans">
  <h3>Add Plan</h3>

  <input id="pname" placeholder="Plan name">
  <input id="pdays" type="number" placeholder="Days">
  <input id="pprice" type="number" placeholder="Price">

  <button onclick="addPlan()">Add Plan</button>
  <hr>
  <div id="plansList"></div>
</div>

<!-- SETTINGS -->
<div class="card hidden" id="settings">
  <h3>Settings</h3>
  Coming soon...
</div>

<!-- NAV -->
<div class="nav">

  <button class="active" onclick="showTab('addUser',this)">
    <i class="fa fa-user-plus"></i>
    Add
  </button>

  <button onclick="showTab('users',this)">
    <i class="fa fa-users"></i>
    Users
  </button>

  <button onclick="showTab('plans',this)">
    <i class="fa fa-list"></i>
    Plans
  </button>

  <button onclick="showTab('settings',this)">
    <i class="fa fa-gear"></i>
    Setting
  </button>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey:"AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
  authDomain:"gym-app-79bec.firebaseapp.com",
  projectId:"gym-app-79bec"
});

const db = firebase.firestore();

/* ===== TAB SWITCH ===== */
function showTab(id, btn){
  document.querySelectorAll(".card").forEach(c=>c.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

/* ===== ADD USER ===== */
function addUser(){
  let name = uname.value.trim();
  let phone = uphone.value.trim();

  if(!name || !phone){
    alert("Fill all fields");
    return;
  }

  db.collection("users").doc(phone).set({
    name, phone
  });

  alert("User added");
  uname.value="";
  uphone.value="";
}

/* ===== LOAD USERS ===== */
db.collection("users").onSnapshot(snap=>{
  let h="";
  snap.forEach(d=>{
    let u=d.data();
    h+=`<p>${u.name} - ${u.phone}</p>`;
  });
  usersList.innerHTML=h || "No users";
});

/* ===== ADD PLAN ===== */
function addPlan(){
  db.collection("plans").add({
    name:pname.value,
    days:+pdays.value,
    price:+pprice.value
  });
}

/* ===== LOAD PLANS ===== */
db.collection("plans").onSnapshot(snap=>{
  let h="";
  snap.forEach(d=>{
    let p=d.data();
    h+=`${p.name} - ${p.days} days - ₹${p.price}<br>`;
  });
  plansList.innerHTML=h;
});

/* ===== LOGOUT ===== */
function adminLogout(){
  localStorage.removeItem("admin");
  location.href="admin-login.html";
}

/* ===== KEYBOARD NAV FIX ===== */
window.addEventListener("resize", () => {
  const nav = document.querySelector(".nav");
  if (!nav) return;

  if (window.innerHeight < window.outerHeight - 150) {
    nav.style.bottom = "70px";
  } else {
    nav.style.bottom = "0px";
  }
});

</script>

</body>
</html>
