<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym App – Admin</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9;padding-bottom:70px}
header{
  background:#111827;color:#fff;padding:14px;
  display:flex;justify-content:space-between;align-items:center
}
.card{
  background:#fff;margin:15px;padding:15px;border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.1)
}
input,select,button{
  width:100%;padding:10px;margin-top:8px;
  border-radius:6px;border:1px solid #ccc
}
button{background:#2563eb;color:#fff;border:none;font-weight:bold}
.ok{background:#16a34a}
.del{background:#dc2626}
.hidden{display:none}

/* bottom nav */
.nav{
  position:fixed;bottom:0;left:0;right:0;height:60px;
  background:#fff;border-top:1px solid #ddd;display:flex
}
.nav button{
  flex:1;background:none;border:none;color:#6b7280;
  font-size:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center
}
.nav button i{font-size:18px}
.nav button.active{color:#2563eb}
</style>
</head>

<body>

<header>
  <h3>🛠️ Admin Panel</h3>
  <i class="fa fa-sign-out-alt" onclick="location.href='index.html'"></i>
</header>

<!-- ADD USER -->
<div class="card" id="addUser">
  <h3>Add User + Assign Plan</h3>
  <input id="uname" placeholder="User name">
  <input id="uphone" placeholder="Phone number">
  <select id="uplan"><option value="">Select Plan</option></select>
  <button onclick="addUserWithPlan()">Add User</button>
</div>

<!-- REQUESTS -->
<div class="card hidden" id="requests">
  <h3>Plan Requests</h3>
  <div id="reqList">Loading...</div>
</div>

<!-- USERS -->
<div class="card hidden" id="users">
  <h3>All Users</h3>
  <input id="searchUser" placeholder="Search name or phone" onkeyup="loadUsers()">
  <div id="usersList">Loading...</div>
</div>

<!-- PLANS -->
<div class="card hidden" id="plans">
  <h3>Add Plan</h3>
  <input id="pname" placeholder="Plan name">
  <input id="pdays" type="number" placeholder="Days">
  <input id="pprice" type="number" placeholder="Price">
  <button onclick="addPlan()">Add Plan</button>
  <hr>
  <div id="plansList">Loading...</div>
</div>

<!-- ATTENDANCE -->
<div class="card hidden" id="attendance">
  <h3>All Attendance</h3>
  <input type="month" id="filterMonth" onchange="loadAttendance()">
  <div id="attendanceList">Loading...</div>
</div>

<!-- QR -->
<div class="card hidden" id="qr">
  <h3>Gym QR</h3>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=GYM_ATTENDANCE">
  <button onclick="window.print()">Print QR</button>
</div>

<!-- NAV -->
<div class="nav">
  <button class="active" onclick="showTab('addUser',this)">
    <i class="fa fa-user-plus"></i>Add
  </button>
  <button onclick="showTab('requests',this)">
    <i class="fa fa-clock"></i>Requests
  </button>
  <button onclick="showTab('users',this)">
    <i class="fa fa-users"></i>Users
  </button>
  <button onclick="showTab('plans',this)">
    <i class="fa fa-list"></i>Plans
  </button>
  <button onclick="showTab('attendance',this)">
    <i class="fa fa-calendar-check"></i>Attendance
  </button>
  <button onclick="showTab('qr',this)">
    <i class="fa fa-qrcode"></i>QR
  </button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
  authDomain:"gym-app-79bec.firebaseapp.com",
  projectId:"gym-app-79bec"
});
const db=firebase.firestore();

/* TAB */
function showTab(id,btn){
  ["addUser","requests","users","plans","attendance","qr"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

/* PLAN OPTIONS */
function loadPlanOptions(){
  db.collection("plans").get().then(s=>{
    let h='<option value="">Select Plan</option>';
    s.forEach(d=>{
      let p=d.data();
      h+=`<option value="${p.name}|${p.days}">
        ${p.name} (${p.days} days – ₹${p.price})
      </option>`;
    });
    uplan.innerHTML=h;
  });
}

/* ADD USER */
function addUserWithPlan(){
  let name=uname.value.trim();
  let phone=uphone.value.trim();
  let plan=uplan.value;
  if(!name||!phone||!plan){alert("Fill all fields");return;}

  let [planName,days]=plan.split("|");
  let exp=new Date(); exp.setDate(exp.getDate()+Number(days));

  db.collection("users").doc(phone).set({
    name,phone,
    currentPlan:planName,
    planStatus:"active",
    paymentStatus:"paid",
    planExpiry:exp.toISOString()
  }).then(()=>{
    alert("User added");
    uname.value=uphone.value=uplan.value="";
  });
}

/* USERS */
function loadUsers(){
  let key=searchUser.value.toLowerCase();
  db.collection("users").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let u=d.data();
      if(key && !u.name.toLowerCase().includes(key) && !u.phone.includes(key)) return;
      h+=`
        <div style="border-bottom:1px solid #eee;padding:8px 0">
          <b>${u.name}</b><br>
          📞 ${u.phone}<br>
          Plan: ${u.currentPlan||"-"}
          <button class="del" onclick="deleteUser('${u.phone}')">Delete</button>
        </div>
      `;
    });
    usersList.innerHTML=h||"No users";
  });
}

function deleteUser(phone){
  if(!confirm("Delete user?")) return;
  db.collection("users").doc(phone).delete();
  db.collection("attendance").where("phone","==",phone).get().then(s=>{
    s.forEach(d=>db.collection("attendance").doc(d.id).delete());
  });
}

/* REQUESTS */
function loadRequests(){
  db.collection("users").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let u=d.data();
      if(u.planStatus==="pending"){
        h+=`
          <p>
            <b>${u.name}</b><br>
            Plan: ${u.requestedPlan}<br>
            ₹${u.requestedPrice}
            <button class="ok" onclick="approvePlan('${u.phone}','${u.requestedPlan}',${u.requestedDays})">
              Approve
            </button>
          </p><hr>`;
      }
    });
    reqList.innerHTML=h||"No requests";
  });
}

function approvePlan(phone,plan,days){
  let exp=new Date(); exp.setDate(exp.getDate()+Number(days));
  db.collection("users").doc(phone).update({
    currentPlan:plan,
    planStatus:"active",
    paymentStatus:"paid",
    planExpiry:exp.toISOString(),
    requestedPlan:"",
    requestedDays:"",
    requestedPrice:""
  });
}

/* PLANS */
function loadPlans(){
  db.collection("plans").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let p=d.data();
      h+=`${p.name} – ${p.days} days – ₹${p.price}
      <button class="del" onclick="db.collection('plans').doc('${d.id}').delete()">Delete</button><hr>`;
    });
    plansList.innerHTML=h||"No plans";
  });
}
function addPlan(){
  db.collection("plans").add({
    name:pname.value,
    days:+pdays.value,
    price:+pprice.value
  });
  pname.value=pdays.value=pprice.value="";
}

/* ATTENDANCE (WITH NAME) */
function loadAttendance(){
  let month=filterMonth.value;
  attendanceList.innerHTML="Loading...";
  db.collection("attendance").get().then(async snap=>{
    let h="";
    for(const d of snap.docs){
      let a=d.data();
      if(month && !a.date.startsWith(month)) continue;

      let u=await db.collection("users").doc(a.phone).get();
      let name=u.exists?u.data().name:"Unknown";

      h+=`
        <div style="border-bottom:1px solid #eee;padding:8px 0">
          👤 <b>${name}</b><br>
          📞 ${a.phone}<br>
          📅 ${a.date}
        </div>
      `;
    }
    attendanceList.innerHTML=h||"No attendance";
  });
}

/* INIT */
loadPlanOptions();
loadUsers();
loadRequests();
loadPlans();
loadAttendance();
</script>

</body>
</html>
