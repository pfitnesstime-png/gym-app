<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym App – Admin</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
  padding-bottom:70px;
}

header{
  background:#111827;
  color:#fff;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card{
  background:#fff;
  margin:15px;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.1)
}

input,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:6px;
  border:1px solid #ccc
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-weight:bold
}

.del{
  background:#dc2626;
}

.ok{
  background:#16a34a;
}

.hidden{display:none}

/* bottom nav */
.nav{
  position:fixed;
  bottom:0;left:0;right:0;
  height:60px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
}

.nav button{
  flex:1;
  background:none;
  border:none;
  font-size:12px;
  color:#6b7280;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.nav button i{font-size:18px}
.nav .active{color:#2563eb}
</style>
</head>

<body>

<header>
  <h3>🛠️ Admin Panel</h3>
  <i class="fa fa-sign-out-alt"
     style="cursor:pointer"
     onclick="location.href='index.html'"></i>
</header>

<!-- PLAN REQUESTS -->
<div class="card" id="requests">
  <h3>Plan Requests</h3>
  <div id="reqList">Loading...</div>
</div>

<!-- PLANS -->
<div class="card hidden" id="plans">
  <h3>Add Plan</h3>
  <input id="pname" placeholder="Plan name">
  <input id="pdays" placeholder="Days">
  <input id="pprice" placeholder="Price">
  <button onclick="addPlan()">Add Plan</button>

  <h3 style="margin-top:20px">Plans</h3>
  <div id="plansList">Loading...</div>
</div>

<!-- USERS -->
<div class="card hidden" id="users">
  <h3>All Users</h3>
  <div id="usersList">Loading...</div>
</div>

<!-- QR -->
<div class="card hidden" id="scan">
  <h3>Gym QR</h3>
  <p>Print & keep inside gym</p>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=GYM_ATTENDANCE">
</div>

<!-- NAV -->
<div class="nav">
  <button class="active" onclick="showTab('requests',this)">
    <i class="fa fa-clock"></i>Requests
  </button>
  <button onclick="showTab('plans',this)">
    <i class="fa fa-list"></i>Plans
  </button>
  <button onclick="showTab('users',this)">
    <i class="fa fa-users"></i>Users
  </button>
  <button onclick="showTab('scan',this)">
    <i class="fa fa-qrcode"></i>QR
  </button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
  authDomain:"gym-app-79bec.firebaseapp.com",
  projectId:"gym-app-79bec"
});
const db=firebase.firestore();

function showTab(id,btn){
  ["requests","plans","users","scan"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

/* PLAN REQUESTS */
function loadRequests(){
  db.collection("users").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let u=d.data();
      if(u.planStatus==="pending"){
        h+=`
          <div style="border:1px solid #eee;padding:10px;margin-bottom:10px">
            <b>${u.name}</b><br>
            📞 ${u.phone}<br>
            Requested: <b>${u.requestedPlan}</b>
            (${u.requestedDays} days)
            <br><br>
            <button class="ok"
              onclick="approve('${d.id}',${u.requestedDays},'${u.requestedPlan}')">
              ✅ Approve
            </button>
            <button class="del"
              onclick="reject('${d.id}')">
              ❌ Reject
            </button>
          </div>
        `;
      }
    });
    reqList.innerHTML = h || "No plan requests";
  });
}

function approve(id,days,plan){
  let exp=new Date();
  exp.setDate(exp.getDate()+days);

  db.collection("users").doc(id).update({
    planStatus:"active",
    currentPlan:plan,
    planExpiry:exp.toISOString(),
    requestedPlan:"",
    requestedDays:""
  });
  alert("Plan approved ✅");
}

function reject(id){
  db.collection("users").doc(id).update({
    planStatus:"inactive",
    requestedPlan:"",
    requestedDays:""
  });
  alert("Plan rejected ❌");
}

/* PLANS */
function loadPlans(){
  db.collection("plans").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let p=d.data();
      h+=`
        <p><b>${p.name}</b> – ${p.days} days – ₹${p.price}</p>
        <button class="del" onclick="delPlan('${d.id}')">Delete</button>
      `;
    });
    plansList.innerHTML=h||"No plans";
  });
}

function addPlan(){
  db.collection("plans").add({
    name:pname.value,
    days:+pdays.value,
    price:+pprice.value
  });
  pname.value=pdays.value=pprice.value="";
}

function delPlan(id){
  if(confirm("Delete plan?"))
    db.collection("plans").doc(id).delete();
}

/* USERS */
function loadUsers(){
  db.collection("users").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let u=d.data();
      h+=`
        <p><b>${u.name}</b><br>
        📞 ${u.phone}<br>
        Plan: ${u.currentPlan||"-"}<br>
        Status: ${u.planStatus||"inactive"}</p>
        <hr>
      `;
    });
    usersList.innerHTML=h||"No users";
  });
}

loadRequests();
loadPlans();
loadUsers();
</script>

</body>
</html>
