<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym App – Admin</title>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
header{background:#111827;color:#fff;text-align:center;padding:14px}
.card{
  background:#fff;margin:15px;padding:15px;border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.1)
}
input,button,select{
  width:100%;padding:10px;margin-top:8px;
  border-radius:6px;border:1px solid #ccc
}
button{background:#2563eb;color:#fff;border:none;font-weight:bold}
.small{font-size:13px;color:#555}
hr{border:none;border-top:1px solid #eee;margin:15px 0}
</style>
</head>

<body>

<header><h2>🛠️ Admin Panel</h2></header>

<!-- ADD PLAN -->
<div class="card">
  <h3>Add Plan</h3>
  <input id="p_name" placeholder="Plan Name">
  <input id="p_days" type="number" placeholder="Days">
  <input id="p_price" type="number" placeholder="Price">
  <button onclick="addPlan()">Add Plan</button>
</div>

<!-- PLANS LIST -->
<div class="card">
  <h3>Plans</h3>
  <div id="plansList">Loading...</div>
</div>

<!-- USERS -->
<div class="card">
  <h3>Users</h3>
  <div id="usersList">Loading...</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* Firebase Init */
if(!firebase.apps.length){
  firebase.initializeApp({
    apiKey: "AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
    authDomain: "gym-app-79bec.firebaseapp.com",
    projectId: "gym-app-79bec"
  });
}
const db = firebase.firestore();

/* ADD PLAN */
function addPlan(){
  if(!p_name.value || !p_days.value){
    alert("Enter plan details"); return;
  }

  db.collection("plans").add({
    name: p_name.value,
    days: Number(p_days.value),
    price: Number(p_price.value)
  }).then(()=>{
    alert("Plan added ✅");
    p_name.value = p_days.value = p_price.value = "";
    loadPlans();
  });
}

/* LOAD PLANS */
function loadPlans(){
  plansList.innerHTML = "Loading...";
  db.collection("plans").get().then(snap=>{
    if(snap.empty){
      plansList.innerHTML = "No plans";
      return;
    }
    let html="";
    snap.forEach(doc=>{
      let p = doc.data();
      html += `
        <div class="small">
          <b>${p.name}</b> – ${p.days} days – ₹${p.price}
          <button onclick="deletePlan('${doc.id}')"
            style="background:#dc2626;margin-top:5px">Delete</button>
          <hr>
        </div>
      `;
    });
    plansList.innerHTML = html;
  });
}

/* DELETE PLAN */
function deletePlan(id){
  if(!confirm("Delete this plan?")) return;
  db.collection("plans").doc(id).delete().then(loadPlans);
}

/* LOAD USERS */
function loadUsers(){
  usersList.innerHTML = "Loading...";
  db.collection("users").get().then(snap=>{
    if(snap.empty){
      usersList.innerHTML = "No users";
      return;
    }
    let html="";
    snap.forEach(doc=>{
      let u = doc.data();
      html += `
        <div class="small">
          <b>${u.name}</b><br>
          Phone: ${u.phone}<br>
          Plan: ${u.currentPlan || "None"}<br>
          <button onclick="assignPlan('${u.phone}')">
            Assign Plan
          </button>
          <hr>
        </div>
      `;
    });
    usersList.innerHTML = html;
  });
}

/* ASSIGN PLAN TO USER */
function assignPlan(phone){
  let plan = prompt("Enter plan name exactly");
  let days = prompt("Enter days");

  if(!plan || !days) return;

  let exp = new Date();
  exp.setDate(exp.getDate() + Number(days));

  db.collection("users").doc(phone).update({
    currentPlan: plan,
    planExpiry: exp.toISOString()
  }).then(()=>{
    alert("Plan assigned ✅");
    loadUsers();
  });
}

/* INIT */
loadPlans();
loadUsers();
</script>

</body>
</html>
