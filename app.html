<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym App</title>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
header{background:#111827;color:#fff;text-align:center;padding:14px}
.card{background:#fff;margin:15px;padding:15px;border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,.1)}
button{
  width:100%;padding:12px;margin-top:10px;
  border-radius:8px;border:none;
  background:#2563eb;color:#fff;font-weight:bold
}
.active{color:green;font-weight:bold}
.expired{color:red;font-weight:bold}
#reader{width:100%}
</style>
</head>

<body>

<header><h2>🏋️ Gym App</h2></header>

<!-- HOME -->
<div class="card">
  <h3 id="welcome">Welcome</h3>
  <p>Plan: <b id="planName">-</b></p>
  <p>Status: <span id="planStatus" class="expired">-</span></p>
  <p>Remaining Days: <b id="days">0</b></p>
</div>

<!-- SCAN -->
<div class="card">
  <h3>Scan Gym QR</h3>
  <div id="reader"></div>
  <p style="font-size:13px;color:#555">
    Scan the QR placed inside gym to mark attendance
  </p>
</div>

<!-- ATTENDANCE HISTORY -->
<div class="card">
  <h3>Attendance History</h3>
  <div id="attList">Loading...</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
/* 🔥 Firebase init */
if(!firebase.apps.length){
  firebase.initializeApp({
    apiKey: "AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
    authDomain: "gym-app-79bec.firebaseapp.com",
    projectId: "gym-app-79bec"
  });
}
const db = firebase.firestore();

/* USER PHONE FROM URL */
const phone = new URLSearchParams(window.location.search).get("phone");
if(!phone){
  alert("Invalid access");
}

/* LOAD USER HOME */
function loadHome(){
  db.collection("users").doc(phone).get().then(doc=>{
    if(!doc.exists) return;
    let u = doc.data();

    welcome.innerText = "Welcome, " + u.name;
    planName.innerText = u.currentPlan || "Not Selected";

    if(u.planStatus === "active"){
      let rem = Math.ceil((new Date(u.planExpiry) - new Date()) / (1000*60*60*24));
      days.innerText = rem > 0 ? rem : 0;
      planStatus.innerText = rem > 0 ? "ACTIVE" : "EXPIRED";
      planStatus.className = rem > 0 ? "active" : "expired";
    }else{
      planStatus.innerText = u.planStatus || "INACTIVE";
      planStatus.className = "expired";
    }
  });
}

/* LOAD ATTENDANCE */
function loadAttendance(){
  attList.innerHTML = "Loading...";
  db.collection("attendance")
    .where("phone","==",phone)
    .get().then(snap=>{
      if(snap.empty){
        attList.innerHTML = "No attendance yet";
        return;
      }
      let html="";
      snap.forEach(d=>{
        html += `<p>${d.data().date} ✅</p>`;
      });
      attList.innerHTML = html;
    });
}

/* QR SCAN LOGIC */
function onScanSuccess(decodedText){
  if(decodedText !== "GYM_ATTENDANCE"){
    alert("Invalid QR ❌");
    return;
  }

  db.collection("users").doc(phone).get().then(userDoc=>{
    if(!userDoc.exists) return;

    let u = userDoc.data();
    if(u.planStatus !== "active"){
      alert("Plan not active ❌");
      return;
    }

    let today = new Date().toISOString().split("T")[0];
    let docId = phone + "_" + today;

    db.collection("attendance").doc(docId).get().then(att=>{
      if(att.exists){
        alert("Already marked today");
      }else{
        db.collection("attendance").doc(docId).set({
          phone: phone,
          date: today,
          method: "qr_scan"
        }).then(()=>{
          alert("Attendance marked ✅");
          loadAttendance();
        });
      }
    });
  });
}

/* START QR CAMERA */
const html5QrCode = new Html5Qrcode("reader");
Html5Qrcode.getCameras().then(devices=>{
  if(devices && devices.length){
    html5QrCode.start(
      devices[0].id,
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  }
});

/* INIT */
loadHome();
loadAttendance();
</script>

</body>
</html>
