<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym App</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9;padding-bottom:80px}
header{
  background:#111827;color:#fff;
  display:flex;justify-content:space-between;
  align-items:center;padding:14px
}
.card{
  background:#fff;margin:15px;padding:15px;
  border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.1)
}
.hidden{display:none}
.active{color:green;font-weight:bold}
.expired{color:red;font-weight:bold}
button{
  width:100%;padding:12px;margin-top:10px;
  border-radius:8px;border:none;
  background:#2563eb;color:#fff;font-weight:bold
}
.nav{
  position:fixed;bottom:0;left:0;right:0;
  height:60px;background:#fff;
  display:flex;border-top:1px solid #ddd
}
.nav button{
  flex:1;background:none;border:none;
  color:#6b7280;font-size:12px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center
}
.nav button i{font-size:20px}
.nav button.activeNav{color:#2563eb}
#reader{width:100%}
</style>
</head>

<body>

<header>
  <h3>🏋️ Gym App</h3>
  <i class="fa fa-sign-out-alt" onclick="logout()"></i>
</header>

<!-- HOME -->
<div class="card" id="home">
  <h3 id="welcome">Welcome</h3>
  <p>Plan: <b id="planName">-</b></p>
  <p>Status: <span id="planStatus" class="expired">-</span></p>
  <p>Remaining Days: <b id="days">0</b></p>
</div>

<!-- SCAN -->
<div class="card hidden" id="scan">
  <h3>Scan Gym QR</h3>
  <div id="reader"></div>
</div>

<!-- ATTENDANCE -->
<div class="card hidden" id="attendance">
  <h3>Attendance History</h3>
  <div id="attList">Loading...</div>
</div>

<!-- PLANS -->
<div class="card hidden" id="plans">
  <h3>Available Plans</h3>
  <div id="plansList">Loading...</div>
</div>

<!-- NAV -->
<div class="nav">
  <button id="navHome" class="activeNav" onclick="showTab('home')">
    <i class="fa fa-house"></i>Home
  </button>
  <button id="navScan" onclick="showTab('scan')">
    <i class="fa fa-camera"></i>Scan
  </button>
  <button id="navAttendance" onclick="showTab('attendance')">
    <i class="fa fa-calendar-check"></i>Attendance
  </button>
  <button id="navPlans" onclick="showTab('plans')">
    <i class="fa fa-list"></i>Plans
  </button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
  authDomain:"gym-app-79bec.firebaseapp.com",
  projectId:"gym-app-79bec"
});
const db=firebase.firestore();

/* LOGIN SESSION */
const phone = localStorage.getItem("gymPhone");
if(!phone) location.href="index.html";

/* TABS */
function showTab(tab){
  ["home","scan","attendance","plans"].forEach(t=>{
    document.getElementById(t).classList.add("hidden");
    document.getElementById("nav"+t.charAt(0).toUpperCase()+t.slice(1))
      .classList.remove("activeNav");
  });

  // 🛑 scan tab വിട്ടാൽ camera stop
  if(tab !== "scan"){
    stopScanner();
  }

  document.getElementById(tab).classList.remove("hidden");
  document.getElementById("nav"+tab.charAt(0).toUpperCase()+tab.slice(1))
    .classList.add("activeNav");

  if(tab === "scan") startCamera();
}


/* LOGOUT */
function logout(){
  localStorage.removeItem("gymPhone");
  location.href="index.html";
}

/* HOME */
function loadHome(){
  db.collection("users").doc(phone).get().then(d=>{
    let u=d.data();
    welcome.innerText="Welcome, "+u.name;
    planName.innerText=u.currentPlan||"-";

    if(u.planStatus==="active"){
      let r=Math.ceil((new Date(u.planExpiry)-new Date())/86400000);
      days.innerText=r>0?r:0;
      planStatus.innerText=r>0?"ACTIVE":"EXPIRED";
      planStatus.className=r>0?"active":"expired";
    }else{
      planStatus.innerText=u.planStatus||"INACTIVE";
      planStatus.className="expired";
    }
  });
}

/* ATTENDANCE */
function loadAttendance(){
  db.collection("attendance").where("phone","==",phone).get().then(s=>{
    let h="";
    s.forEach(d=>h+=`<p>${d.data().date} ✅</p>`);
    attList.innerHTML=h||"No attendance";
  });
}

/* PLANS */
function loadPlans(){
  db.collection("plans").get().then(s=>{
    let h="";
    s.forEach(d=>{
      let p=d.data();
      h+=`
        <p><b>${p.name}</b> – ${p.days} days – ₹${p.price}</p>
        <button onclick="requestPlan('${p.name}',${p.days},${p.price})">
          Request
        </button><hr>
      `;
    });
    plansList.innerHTML=h||"No plans";
  });
}

function requestPlan(name,days,price){
  db.collection("users").doc(phone).update({
    requestedPlan:name,
    requestedDays:days,
    requestedPrice:price,
    planStatus:"pending"
  });
  alert("Please pay ₹"+price+" at gym");
  showTab("home");
}

/* CAMERA + SCAN */
let qr = null;

/* START CAMERA */
function startCamera(){
  if(qr) return;

  qr = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices=>{
    if(devices.length === 0){
      alert("Camera not found");
      return;
    }

    let camera =
      devices.find(d => d.label.toLowerCase().includes("back")) || devices[0];

    qr.start(
      camera.id,
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  });
}

/* STOP CAMERA */
function stopScanner(){
  if(qr){
    qr.stop().then(()=>{
      qr.clear();
      qr = null;
    });
  }
}

/* QR SCAN SUCCESS */
function onScanSuccess(decodedText){
  if(decodedText !== "GYM_ATTENDANCE"){
    alert("❌ Invalid QR Code");
    stopScanner();
    return;
  }

  const today = new Date().toISOString().slice(0,10);

  db.collection("users").doc(phone).get().then(doc=>{
    if(!doc.exists){
      alert("User not found");
      stopScanner();
      return;
    }

    const user = doc.data();

    // ❌ plan / payment check
    if(
      user.paymentStatus === "pending" ||
      !user.planExpiry ||
      new Date(user.planExpiry) < new Date()
    ){
      alert("❌ Your plan is expired or payment pending");
      stopScanner();
      return;
    }

    // 🔁 already submitted today?
    db.collection("attendance")
      .where("phone","==",phone)
      .where("date","==",today)
      .get()
      .then(snap=>{
        if(!snap.empty){
          alert("ℹ️ Attendance already submitted today");
          stopScanner();
          return;
        }

        // ✅ save attendance
        db.collection("attendance").add({
          phone: phone,
          date: today,
          time: new Date().toLocaleTimeString()
        }).then(()=>{
          alert("✅ Your attendance submitted successfully");
          stopScanner();
        });
      });
  });
}


/* INIT */
loadHome();
loadAttendance();
loadPlans();
</script>

</body>
</html>
