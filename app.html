<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym App</title>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
  padding-bottom:80px;
}

/* HEADER */
header{
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
}
header h2{margin:0}
.logout{
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* CARD */
.card{
  background:#fff;
  margin:15px;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}
.hidden{display:none}
.active{color:green;font-weight:bold}
.expired{color:red;font-weight:bold}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
}

/* BOTTOM NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:#ffffff;
  display:flex;
  border-top:1px solid #ddd;
  z-index:999;
}
.nav button{
  flex:1;
  background:none;
  border:none;
  color:#6b7280;
  font-size:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.nav button i{
  font-size:20px;
  margin-bottom:4px;
}
.nav button.activeNav{
  color:#2563eb;
}

#reader{width:100%}
</style>
</head>

<body>

<header>
  <h2>🏋️ Gym App</h2>
  <div class="logout" onclick="logout()">
    <i class="fa fa-sign-out-alt"></i>
  </div>
</header>

<!-- HOME -->
<div class="card" id="home">
  <h3 id="welcome">Welcome</h3>
  <p>Plan: <b id="planName">-</b></p>
  <p>Status: <span id="planStatus" class="expired">-</span></p>
  <p>Remaining Days: <b id="days">0</b></p>
</div>

<!-- SCAN -->
<div class="card hidden" id="scan">
  <h3>Scan Gym QR</h3>
  <div id="reader"></div>
  <p style="font-size:13px;color:#555">Scan QR inside gym</p>
</div>

<!-- ATTENDANCE -->
<div class="card hidden" id="attendance">
  <h3>Attendance History</h3>
  <div id="attList">Loading...</div>
</div>

<!-- PLANS -->
<div class="card hidden" id="plans">
  <h3>Available Plans</h3>
  <div id="plansList">Loading...</div>
</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <button id="navHome" class="activeNav" onclick="showTab('home')">
    <i class="fa fa-house"></i>Home
  </button>
  <button id="navScan" onclick="showTab('scan')">
    <i class="fa fa-camera"></i>Scan
  </button>
  <button id="navAttendance" onclick="showTab('attendance')">
    <i class="fa fa-calendar-check"></i>Attendance
  </button>
  <button onclick="requestPlan('${p.name}',${p.days},${p.price})">
  Request – ₹${p.price}
</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
/* Firebase init */
if(!firebase.apps.length){
  firebase.initializeApp({
    apiKey:"AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
    authDomain:"gym-app-79bec.firebaseapp.com",
    projectId:"gym-app-79bec"
  });
}
const db = firebase.firestore();

/* USER */
const phone = new URLSearchParams(location.search).get("phone");
if(!phone){
  location.href="index.html";
}

/* TAB SWITCH */
function showTab(tab){
  ["home","scan","attendance","plans"].forEach(t=>{
    document.getElementById(t).classList.add("hidden");
    document.getElementById("nav"+t.charAt(0).toUpperCase()+t.slice(1))
      .classList.remove("activeNav");
  });
  document.getElementById(tab).classList.remove("hidden");
  document.getElementById("nav"+tab.charAt(0).toUpperCase()+tab.slice(1))
    .classList.add("activeNav");
}

/* LOGOUT */
function logout(){
  if(confirm("Logout?")){
    location.href="index.html";
  }
}

/* LOAD HOME */
function loadHome(){
  db.collection("users").doc(phone).get().then(d=>{
    if(!d.exists) return;
    let u=d.data();
    welcome.innerText="Welcome, "+u.name;
    planName.innerText=u.currentPlan || "-";

    if(u.planStatus==="active"){
      let r=Math.ceil((new Date(u.planExpiry)-new Date())/86400000);
      days.innerText=r>0?r:0;
      planStatus.innerText=r>0?"ACTIVE":"EXPIRED";
      planStatus.className=r>0?"active":"expired";
    }else{
      planStatus.innerText=u.planStatus || "INACTIVE";
      planStatus.className="expired";
    }
  });
}

/* ATTENDANCE */
function loadAttendance(){
  attList.innerHTML="Loading...";
  db.collection("attendance").where("phone","==",phone).get().then(s=>{
    if(s.empty){
      attList.innerHTML="No attendance";
      return;
    }
    let h="";
    s.forEach(d=>{
      h+=`<p>${d.data().date} ✅</p>`;
    });
    attList.innerHTML=h;
  });
}

/* LOAD PLANS */
function loadPlans(){
  plansList.innerHTML="Loading...";
  db.collection("plans").get().then(s=>{
    if(s.empty){
      plansList.innerHTML="No plans";
      return;
    }
    let h="";
    s.forEach(d=>{
      let p=d.data();
      h+=`
        <div style="border-bottom:1px solid #eee;padding:8px 0">
          <b>${p.name}</b><br>
          ${p.days} days – ₹${p.price}
          <button onclick="requestPlan('${p.name}',${p.days})">Request</button>
        </div>
      `;
    });
    plansList.innerHTML=h;
  });
}

/* REQUEST PLAN */
function requestPlan(name,days,price){
  db.collection("users").doc(phone).update({
    requestedPlan:name,
    requestedDays:days,
    requestedPrice:price,
    planStatus:"pending",
    paymentStatus:"pending"
  }).then(()=>{
    alert("Plan requested. Please pay ₹"+price+" at gym");
    loadHome();
    showTab('home');
  });
}

/* QR SCAN */
function onScanSuccess(txt){
  if(txt!=="GYM_ATTENDANCE"){
    alert("Invalid QR");
    return;
  }
  let today=new Date().toISOString().split("T")[0];
  let id=phone+"_"+today;

  db.collection("users").doc(phone).get().then(u=>{
    if(u.data().planStatus!=="active"){
      alert("Plan not active");
      return;
    }
    db.collection("attendance").doc(id).get().then(a=>{
      if(a.exists){
        alert("Already marked today");
        return;
      }
      db.collection("attendance").doc(id).set({
        phone:phone,
        date:today
      }).then(()=>{
        alert("Attendance marked ✅");
        loadAttendance();
      });
    });
  });
}

/* START CAMERA */
const qr = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {
  if (!devices || devices.length === 0) {
    alert("No camera found");
    return;
  }

  // Try to find back camera
  let backCamera = devices.find(d =>
    d.label.toLowerCase().includes("back") ||
    d.label.toLowerCase().includes("rear")
  );

  // If not found, use last camera
  let cameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;

  qr.start(
    cameraId,
    { fps: 10, qrbox: 250 },
    onScanSuccess
  );
});

/* INIT */
loadHome();
loadAttendance();
loadPlans();
</script>

</body>
</html>
