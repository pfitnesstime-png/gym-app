<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer Login</title>
<style>
:root{--bg:#070811;--surface:#0f1724;--surface-soft:#111827;--text:#e2e8f0;--muted:#94a3b8;--accent:#ef4444;--accent-soft:#f8d7da;--border:#334155;--shadow:0 30px 80px rgba(15,23,42,.4)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(circle at top,#1e293b 0%,#070811 55%,#02040a 100%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
.page{width:min(480px,100%)}
.hero{margin-bottom:28px;text-align:center}
.hero strong{display:block;font-size:2rem;color:#fff;letter-spacing:.08em;margin-bottom:10px}
.hero span{color:var(--muted);font-size:1rem}
.card{background:var(--surface);border:1px solid rgba(148,163,184,.12);border-radius:32px;box-shadow:var(--shadow);overflow:hidden}
.card-top{padding:32px 32px 0;background:linear-gradient(180deg,rgba(239,68,68,.15),transparent 70%)}
.card-top h1{margin:0;font-size:1.75rem;letter-spacing:.02em}
.card-top p{margin:12px 0 0;color:var(--muted);line-height:1.7}
.card-body{padding:32px}
.form-group{margin-top:20px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:8px}
input{width:100%;padding:16px 18px;border-radius:18px;border:1px solid var(--border);background:var(--surface-soft);color:var(--text);font-size:1rem;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
input:focus{border-color:rgba(239,68,68,.65);box-shadow:0 0 0 6px rgba(239,68,68,.1)}
button{width:100%;padding:16px;border:none;border-radius:18px;background:var(--accent);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .18s ease,background .18s ease,box-shadow .18s ease;margin-top:20px}
button:hover{transform:translateY(-1px);background:#dc2626;box-shadow:0 18px 30px rgba(239,68,68,.2)}
.footer{margin-top:20px;text-align:center;font-size:.95rem;color:var(--muted)}
.footer a{color:var(--accent);text-decoration:none;font-weight:700}
.tip{margin-top:18px;padding:16px;border-radius:18px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);color:#f8e3e8;font-size:.95rem;line-height:1.6}
@media(max-width:420px){.card{border-radius:24px}.card-top{padding:24px}.card-body{padding:24px}}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <strong>FitZone Trainer</strong>
    <span>Secure access for trainers — manage workouts, plans and progress.</span>
  </div>
  <div class="card">
    <div class="card-top">
      <h1>Login to your dashboard</h1>
      <p>Use your trainer credentials to continue.</p>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" placeholder="trainer" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="1234" autocomplete="current-password">
      </div>
      <button onclick="loginTrainer()">Login</button>
      <div class="tip">Demo credentials:&nbsp;<strong>trainer</strong> / <strong>1234</strong></div>
      <div class="footer">Need a staff account? <a href="admin-login.html">Admin login</a></div>
    </div>
  </div>
</div>
<script>
function loginTrainer(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(u==='trainer' && p==='1234'){
    localStorage.setItem('gymTrainer','true');
    window.location.href='trainer.html';
  } else {
    alert('Incorrect trainer credentials');
  }
}
</script>
</body>
</html>
