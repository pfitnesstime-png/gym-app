<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym App – Register / Login</title>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
header{background:#111827;color:#fff;text-align:center;padding:15px}
.card{
  background:#fff;margin:20px;padding:20px;border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.1)
}
input,button{
  width:100%;padding:12px;margin-top:10px;
  border-radius:8px;border:1px solid #ccc;font-size:15px
}
button{background:#2563eb;color:#fff;border:none;font-weight:bold}
.link{margin-top:15px;text-align:center;color:#2563eb;cursor:pointer}
.hidden{display:none}
</style>
</head>

<body>

<header><h2>🏋️ Gym App</h2></header>

<!-- REGISTER -->
<div class="card" id="registerBox">
  <h3>Register</h3>

  <input id="r_name" placeholder="Name">
  <input id="r_phone" placeholder="Phone">
  <input id="r_email" placeholder="Email">
  <input id="r_age" type="number" placeholder="Age">
  <input id="r_weight" type="number" placeholder="Weight (kg)">
  <input id="r_height" type="number" placeholder="Height (cm)">

  <button onclick="register()">Register</button>

  <div class="link" onclick="showLogin()">Already have account? Login</div>
</div>

<!-- LOGIN -->
<div class="card hidden" id="loginBox">
  <h3>Login</h3>

  <input id="l_phone" placeholder="Phone">
  <button onclick="login()">Login</button>

  <div class="link" onclick="showRegister()">New user? Register</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCfeXRcZ-gfUboT3irAHbMe0_3qphUD1X0",
  authDomain: "gym-app-79bec.firebaseapp.com",
  projectId: "gym-app-79bec"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// TOGGLE
function showLogin(){
  registerBox.classList.add("hidden");
  loginBox.classList.remove("hidden");
}
function showRegister(){
  loginBox.classList.add("hidden");
  registerBox.classList.remove("hidden");
}

// REGISTER
function register(){
  let phone = r_phone.value.trim();
  if(!r_name.value || !phone){
    alert("Name & Phone required");
    return;
  }

  db.collection("users").doc(phone).get().then(doc=>{
    if(doc.exists){
      alert("User already exists. Login.");
      showLogin();
    }else{
      db.collection("users").doc(phone).set({
        name: r_name.value,
        phone: phone,
        email: r_email.value,
        age: r_age.value,
        weight: r_weight.value,
        height: r_height.value,
        createdAt: new Date()
      }).then(()=>{
        alert("Registered successfully ✅");
        showLogin();
      });
    }
  });
}

// LOGIN
function login(){
  let phone = l_phone.value.trim();
  if(!phone){
    alert("Enter phone number");
    return;
  }

  db.collection("users").doc(phone).get().then(doc=>{
    if(doc.exists){
      alert("Login success ✅");
      // next page (optional)
      // location.href="home.html";
    }else{
      alert("User not found. Please register.");
      showRegister();
    }
  });
}
</script>

</body>
</html>
